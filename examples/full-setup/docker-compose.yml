# docker compose up --build
#
# 1. Open http://localhost:4500 and sign in with the admin token (`docker compose logs dashboard`, or set PULSE_ADMIN_TOKEN below).
# 2. Register a project with export URL  http://app:5000/_pulse/export  (the dashboard reaches the app by its service name).
# 3. Put the returned apiKey / id into .env as PULSE_API_KEY / PULSE_PROJECT_ID and run: docker compose up -d app
services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "4500:4500"
    volumes:
      - pulse-dashboard-data:/data
    # environment:
    #   PULSE_ADMIN_TOKEN: "<a long random secret, 24+ characters>"
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - app-pulse-records:/data
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  pulse-dashboard-data:
  app-pulse-records:
